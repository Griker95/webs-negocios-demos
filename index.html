<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Webs para negocios · demos</title><meta name='robots' content='noindex'><style>
*{box-sizing:border-box}
:root{--acento:#2f6be6;--tinta:#16181d;--txt:#2b2f36;--gris:#6a707c;--linea:#e6e8ec;--papel:#fbfaf8;--card:#fff}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--txt);background:var(--papel);line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.aviso{background:#fff7d6;color:#5c4a00;font-size:13.5px;text-align:center;padding:8px 16px;border-bottom:1px solid #ecdfa6}
nav{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);border-bottom:1px solid var(--linea)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
nav .marca{font-weight:700;color:var(--tinta);text-decoration:none;font-size:17px}
.btn{display:inline-block;padding:11px 18px;border-radius:8px;text-decoration:none;font-weight:600;font-size:15px;border:1.5px solid var(--acento);color:var(--acento);background:transparent}
.btn.pri{background:var(--acento);color:#fff}
.btn:hover{filter:brightness(.93)}
header{background:linear-gradient(135deg,var(--acento),var(--tinta) 140%);color:#fff;padding:72px 0 64px}
header .sector{text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;font-weight:600;opacity:.85}
header h1{font-size:clamp(30px,5.2vw,46px);line-height:1.12;margin:10px 0 14px;letter-spacing:-.02em;max-width:720px;text-wrap:balance}
header p{font-size:18px;max-width:600px;margin:0 0 26px;opacity:.94}
header .acciones{display:flex;flex-wrap:wrap;gap:10px}
header .btn{border-color:rgba(255,255,255,.6);color:#fff}
header .btn.pri{background:#fff;color:var(--tinta);border-color:#fff}
section{padding:56px 0}
section+section{border-top:1px solid var(--linea)}
h2{font-size:26px;color:var(--tinta);margin:0 0 22px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--linea);border-radius:12px;padding:20px}
.card h3{margin:0 0 6px;font-size:17px;color:var(--tinta)}
.card p{margin:0;color:var(--gris);font-size:15px}
.card .precio{display:block;margin-top:10px;font-weight:700;color:var(--acento);font-variant-numeric:tabular-nums}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:28px}
table{border-collapse:collapse;width:100%}
td{padding:9px 0;border-bottom:1px solid var(--linea);font-variant-numeric:tabular-nums}
td:last-child{text-align:right;color:var(--tinta);font-weight:600}
.donde p{margin:0 0 14px}
blockquote{margin:0;background:var(--card);border:1px solid var(--linea);border-left:3px solid var(--acento);border-radius:10px;padding:18px 20px}
blockquote p{margin:0 0 8px}
blockquote cite{font-style:normal;color:var(--gris);font-size:14px}
.contacto{background:var(--tinta);color:#fff;border-top:0}
.contacto h2{color:#fff}
.contacto p{margin:0 0 20px;opacity:.85;max-width:520px}
.contacto .acciones{display:flex;flex-wrap:wrap;gap:10px}
.contacto .btn{border-color:rgba(255,255,255,.5);color:#fff}
.contacto .btn.pri{background:#fff;color:var(--tinta);border-color:#fff}
footer{padding:22px 0;font-size:13px;color:var(--gris);text-align:center}
@media(max-width:700px){.dos{grid-template-columns:1fr}header{padding:52px 0 46px}nav .btn{padding:8px 12px;font-size:14px}}
</style></head><body><section><div class='wrap'><h2>Webs para negocios: demos</h2><p>Negocios inventados. Cada web sale de un archivo de datos, sin cookies ni servicios de terceros.</p><div class='grid'><a class='card' href='fisio-alameda/' style='text-decoration:none;border-top:3px solid #1f7a6d'><h3>Fisio Alameda</h3><p>Clínica de fisioterapia · Valencia</p></a><a class='card' href='peluqueria-marea/' style='text-decoration:none;border-top:3px solid #b4536b'><h3>Peluquería Marea</h3><p>Peluquería unisex · Gijón</p></a><a class='card' href='talleres-ribera/' style='text-decoration:none;border-top:3px solid #c2571a'><h3>Talleres Ribera</h3><p>Mecánica general y pre-ITV · Zaragoza</p></a></div></div></section></body></html>
